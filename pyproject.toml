[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-kv-evictor"
version = "0.1.0"
description = "Size-bounded eviction for vLLM's filesystem KV-cache offload tier"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"

[project.scripts]
vllm-kv-evictor = "evictor:main"

[tool.setuptools]
py-modules = ["evictor"]
